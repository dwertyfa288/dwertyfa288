  <stop offset=".5" stop-color="#ffffff" stop-opacity=".12"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
 </linearGradient>
 <linearGradient id="sheen-soft" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
  <stop offset=".5" stop-color="#5eead4" stop-opacity=".3"/>
  <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
 </linearGradient>
 <radialGradient id="haloA" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#5eead4" stop-opacity=".55"/>
