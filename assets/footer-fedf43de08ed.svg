<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="176" viewBox="0 0 1100 176" role="img" aria-labelledby="asset-title">
<title id="asset-title">Есть идея? Дадим ей форму. Написать dwertyfa в Telegram: t.me/dwertyfa</title>
<defs>
