<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="asset-title">
<title id="asset-title">Привет, я dwertyfa. Создаю сайты, плагины и интеграции. Веб: 3D и анимации. Голос: Astra и Telegram. Стек: TypeScript, React, Next.js, Go, Rust, Tauri, Python. Также Three.js и Astra Plugin SDK.</title>
