<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="208" viewBox="0 0 1100 208" role="img" aria-labelledby="title">
<title id="title">Astra Interject: Продолжение диалога без повторного триггерного слова.</title>
<defs>
 <clipPath id="panel-clip"><rect width="1100" height="208" rx="18"/></clipPath>
 <linearGradient id="accent"><stop stop-color="#bba7ff"/><stop offset="1" stop-color="#88f3cf"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#7359c4" stop-opacity=".35"/><stop offset="1" stop-color="#0c1018" stop-opacity="0"/></radialGradient>
 <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#141925"/><stop offset="1" stop-color="#0b1018"/></linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
text {font-family: 'Segoe UI', Arial, sans-serif;}
.mono {font-family: Consolas, 'Courier New', monospace;}
.orbit {stroke-dasharray:150 580; animation: orbit 9s linear infinite;}
.reverse {animation-direction:reverse; animation-duration:21s;}
.pulse {animation:pulse 5s ease-in-out infinite;}
.flow {stroke-dasharray:44 174; animation:flow 5s linear infinite;}
.float {animation:float 5s ease-in-out infinite;}
.aurora {animation:aurora 9s ease-in-out infinite;}
.horizon {animation:horizon 7s ease-in-out infinite;}
.edge {stroke-dasharray:170 3000; animation:edge 13s linear infinite; opacity:.6;}
.sparkle {animation:sparkle 4s ease-in-out infinite;}
.equalizer {transform-box:fill-box; transform-origin:center; animation:equalizer 1.7s ease-in-out infinite;}
.badge {animation:badge 6s ease-in-out infinite;}
@keyframes float {0%,100% {transform:translateY(0);} 50% {transform:translateY(-7px);}}
@keyframes aurora {0%,100% {opacity:.3;transform:translateX(20px);} 50% {opacity:1;transform:translateX(-100px);}}
@keyframes horizon {0% {transform:translateX(0);opacity:0;} 15%,80% {opacity:.8;} 100% {transform:translateX(1400px);opacity:0;}}
@keyframes edge {to {stroke-dashoffset:-3170;}}
@keyframes sparkle {0%,100% {opacity:.12;} 50% {opacity:.9;}}
@keyframes equalizer {0%,100% {transform:scaleY(.45);opacity:.45;} 50% {transform:scaleY(1);opacity:1;}}
@keyframes badge {0%,100% {stroke:#39364f;} 50% {stroke:#8270ac;}}
@keyframes orbit {to {stroke-dashoffset:-730;}}
@keyframes flow {to {stroke-dashoffset:-436;}}
@keyframes pulse {0%,100% {opacity:.35;} 50% {opacity:1;}}
@media (prefers-reduced-motion:reduce) {* {animation:none !important;}}
</style>

<rect x=".5" y=".5" width="1099" height="207" rx="17" fill="url(#panel)" stroke="#2b3041"/><g clip-path="url(#panel-clip)" pointer-events="none">
<ellipse class="aurora" cx="960" cy="104.0" rx="280" ry="166.4" fill="url(#halo)"/>
<path class="horizon" d="M-250 206h250" stroke="url(#accent)" stroke-width="3"/>
</g>
<rect x="1" y="39" width="3" height="130" rx="1.5" fill="#bba7ff"/>
<text x="30" y="35" fill="#bba7ff" font-size="12" letter-spacing="1.8" class="mono">02 / NATURAL CONVERSATION</text>
<text x="30" y="85" fill="#f1f2fa" font-size="33" font-weight="600">Astra Interject</text>
<text x="30" y="123" fill="#aeb7cb" font-size="19">Продолжение диалога без повторного триггерного слова.</text>
<text x="30" y="174" fill="#bba7ff" font-size="13" class="mono" letter-spacing="1">TYPESCRIPT   /   AUDIO   /   ASTRA</text>
<path d="M813 30V178" stroke="#2b3041"/>
<g class="float"><g class="pulse"><rect class="equalizer" style="animation-delay:-0.0s" x="886" y="99" width="5" height="16" rx="2" fill="#bba7ff" opacity="0.25"/><rect class="equalizer" style="animation-delay:-0.19s" x="899" y="91" width="5" height="32" rx="2" fill="#bba7ff" opacity="0.31"/><rect class="equalizer" style="animation-delay:-0.38s" x="912" y="83" width="5" height="48" rx="2" fill="#bba7ff" opacity="0.37"/><rect class="equalizer" style="animation-delay:-0.5700000000000001s" x="925" y="75" width="5" height="64" rx="2" fill="#bba7ff" opacity="0.43"/><rect class="equalizer" style="animation-delay:-0.76s" x="938" y="99" width="5" height="16" rx="2" fill="#bba7ff" opacity="0.49"/><rect class="equalizer" style="animation-delay:-0.95s" x="951" y="91" width="5" height="32" rx="2" fill="#bba7ff" opacity="0.55"/><rect class="equalizer" style="animation-delay:-1.1400000000000001s" x="964" y="83" width="5" height="48" rx="2" fill="#bba7ff" opacity="0.61"/><rect class="equalizer" style="animation-delay:-1.33s" x="977" y="75" width="5" height="64" rx="2" fill="#bba7ff" opacity="0.6699999999999999"/><rect class="equalizer" style="animation-delay:-1.52s" x="990" y="99" width="5" height="16" rx="2" fill="#bba7ff" opacity="0.73"/></g></g>
<path d="M1042 35h16v16m-16 0 16-16" fill="none" stroke="#adb5cb" stroke-width="1.8"/>
<rect class="edge" x="1.5" y="1.5" width="1097" height="205" rx="17" fill="none" stroke="url(#accent)" stroke-width="1.3" pointer-events="none"/>
</svg>