<text x="30" y="85" fill="#f1f2fa" font-size="33" font-weight="600">Roxy Boost</text>
<text x="30" y="123" fill="#aeb7cb" font-size="19">VPN-продукт: от инфраструктуры до приложения и сайта.</text>
<text x="30" y="174" fill="#bba7ff" font-size="13" class="mono" letter-spacing="1">FULL-STACK   /   VPN   /   INFRASTRUCTURE</text>
